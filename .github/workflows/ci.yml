name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.11.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: HTTP tests
        run: npm run test:e2e

      - name: Check deployment script
        run: bash -n deploy/scripts/deploy-release.sh

      - name: Package validated build
        run: node scripts/package-release.mjs

      - name: Verify release checksum
        working-directory: release
        run: sha256sum --strict --check hogarscan-api.tar.gz.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hogarscan-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/hogarscan-api.tar.gz
            release/hogarscan-api.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
