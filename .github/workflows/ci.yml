name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_name: hogarscan-api-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.11.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate OpenAPI
        run: npm run validate:openapi

      - name: Check TypeScript
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: HTTP tests
        run: npm run test:e2e

      - name: Check deployment scripts
        run: |
          for script in deploy/scripts/*.sh; do
            bash -n "$script"
          done

      - name: Package validated build
        run: node scripts/package-release.mjs

      - name: Verify release checksum
        working-directory: release
        run: sha256sum --strict --check hogarscan-api.tar.gz.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hogarscan-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/hogarscan-api.tar.gz
            release/hogarscan-api.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    name: Deploy development API
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
      DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_PAGER: ''
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'

    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          : "${AWS_REGION:?Falta AWS_REGION}"
          : "${AWS_DEPLOY_ROLE_ARN:?Falta AWS_DEPLOY_ROLE_ARN}"
          : "${DEPLOY_BUCKET:?Falta AWS_DEPLOY_BUCKET}"
          : "${DEPLOY_INSTANCE_ID:?Falta AWS_DEPLOY_INSTANCE_ID}"
          : "${API_BASE_URL:?Falta API_BASE_URL}"
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]]

      - name: Download validated release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: release

      - name: Verify release checksum
        working-directory: release
        run: sha256sum --strict --check hogarscan-api.tar.gz.sha256

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '340514595798'
          role-session-name: GitHubDeploy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload release to S3
        shell: bash
        run: |
          for filename in hogarscan-api.tar.gz hogarscan-api.tar.gz.sha256; do
            aws s3 cp "release/$filename" \
              "s3://$DEPLOY_BUCKET/releases/$RELEASE_ID/$filename" \
              --only-show-errors
          done

      - name: Deploy through SSM and wait for result
        shell: bash
        run: |
          parameters=$(jq -cn \
            --arg command "/usr/local/sbin/hogarscan-deploy-release $RELEASE_ID" \
            '{commands: [$command], executionTimeout: ["900"]}')

          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --timeout-seconds 60 \
            --parameters "$parameters" \
            --query Command.CommandId --output text)

          printf 'SSM command: %s\n' "$command_id"
          deadline=$((SECONDS + 1100))

          while (( SECONDS < deadline )); do
            if aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$DEPLOY_INSTANCE_ID" \
              --cli-connect-timeout 5 --cli-read-timeout 10 \
              --output json > invocation.json 2> invocation.err; then
              status=$(jq -r '.Status' invocation.json)
              printf 'Deployment status: %s\n' "$status"

              case "$status" in
                Pending|InProgress|Delayed|Cancelling) ;;
                *)
                  jq -r '.StandardOutputContent, .StandardErrorContent' invocation.json
                  [[ "$status" == Success ]] && \
                    jq -e '.ResponseCode == 0' invocation.json > /dev/null
                  exit $?
                  ;;
              esac
            else
              error=$(< invocation.err)
              if [[ "$error" != *InvocationDoesNotExist* ]]; then
                printf '%s\n' "$error" >&2
                exit 1
              fi
            fi
            sleep 10
          done

          printf 'Se agotó la espera del resultado SSM: %s\n' "$command_id" >&2
          exit 1

      - name: Verify public readiness
        shell: bash
        run: |
          code=$(curl --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            --output readiness.json --write-out '%{http_code}' \
            "$API_BASE_URL/health/ready")
          cat readiness.json
          [[ "$code" == 200 ]]
          jq -e '.status == "ok"' readiness.json > /dev/null
